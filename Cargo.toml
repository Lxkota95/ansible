[package]
name = "ansible"
version = "0.3.0"
edition = "2024"
# Oldest Rust with edition 2024; checked in CI
rust-version = "1.85"
description = "Rust API for Ansible"
authors = ["Lxkota"]
repository = "https://github.com/Lxkota95/ansible"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/ansible"
keywords = ["ansible", "inventory", "devops", "automation"]
categories = ["api-bindings", "development-tools"]
# Keep CI config out of the published crate
exclude = ["/.github"]

[dependencies]
serde_json = "1.0.140"
thiserror = "2.0.21"
