name: Release

# Every merge to main runs this, but it only publishes when Cargo.toml's version isn't on crates.io
# yet. To release: bump `version` in Cargo.toml (and CHANGELOG.md) in the PR, then merge.
on:
  push:
    branches: [main]

permissions:
  contents: write # push the vX.Y.Z tag
  id-token: write # crates.io trusted publishing (OIDC): no API token stored in the repo

# Never run two releases at once
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check whether this version is already on crates.io
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "${{ github.repository }} release workflow" \
            "https://crates.io/api/v1/crates/ansible/$version")
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "ansible $version is already published" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "ansible $version is new: publishing" ;;
            *) echo "::error::crates.io returned HTTP $code; not guessing"; exit 1 ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.publish == 'true'

      # Same gate as CI, on the exact commit being released
      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          pipx install ansible-core
          cargo test

      - name: Get a short-lived crates.io token
        if: steps.version.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.version.outputs.publish == 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
